project:
  name: "Quantitative Portfolio Intelligence & Risk Optimization Platform"
  short_name: "QPIR"
  version: "0.1.0"
  environment: "development"

data:
  provider: "yfinance"
  format: "parquet"
  preserve_raw_data: true
  timezone: "America/New_York"

portfolio:
  initial_capital: 100000
  base_currency: "USD"
  risk_free_rate: 0.04
  trading_days_per_year: 252
  min_weight: 0.0
  max_weight: 0.50
  allow_short_selling: false

optimization:
  covariance_method: "ledoit_wolf"
  expected_return_method: "historical_mean"
  objective: "max_sharpe"
  solver: "CLARABEL"

backtesting:
  initial_capital: 100000
  rebalance_frequency: "monthly"
  transaction_cost_bps: 10
  slippage_bps: 5
  walk_forward: true

risk:
  confidence_level: 0.95
  var_method: "historical"
  cvar_method: "historical"

reporting:
  save_csv: true
  save_parquet: true
  save_excel: true
  save_figures: true
