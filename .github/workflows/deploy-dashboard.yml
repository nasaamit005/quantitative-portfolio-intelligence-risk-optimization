
name: Deploy Portfolio Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "reports/enhanced/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify complete dashboard
        shell: bash
        run: |
          set -euo pipefail

          test -s reports/enhanced/index.html
          test -s reports/enhanced/qpi/index.html
          test -s reports/enhanced/qpi/manifest.json
          test -s reports/enhanced/qpi/data/performance.csv

          CSV_COUNT=$(find reports/enhanced/qpi/data -maxdepth 1 -type f -name '*.csv' | wc -l)

          echo "CSV datasets found: ${CSV_COUNT}"

          if [ "$CSV_COUNT" -ne 31 ]; then
            echo "ERROR: Expected 31 CSV datasets."
            exit 1
          fi

          echo "Dashboard verification passed."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete website
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/enhanced

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
