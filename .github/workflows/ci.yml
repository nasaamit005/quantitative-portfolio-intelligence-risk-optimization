name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install LibreOffice (Excel recalculation test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - name: Install dependencies
        run: python -m pip install numpy pandas scipy pyarrow yfinance scikit-learn matplotlib seaborn plotly flask pyyaml openpyxl pytest ruff
      - run: python -m ruff check .
      - run: python -m pytest -q
