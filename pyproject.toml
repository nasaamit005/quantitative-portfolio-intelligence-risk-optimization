[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantitative-portfolio-intelligence-risk-optimization"
version = "0.1.0"
description = "Advanced US multi-asset portfolio optimization, quantitative modelling, risk management and backtesting platform."
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
